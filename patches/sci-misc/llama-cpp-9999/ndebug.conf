# Canonical per-package env for sci-misc/llama-cpp (tracked in apotl/local-overlay).
# Symlinked from /etc/portage/env/ndebug.conf and selected via
# /etc/portage/package.env (see package.env.sample in this directory).
#
# Build llama-cpp as a real release: define NDEBUG so device-side asserts are not
# compiled into the HIP kernels. The Gentoo cmake build type leaves asserts ON
# (no -DNDEBUG), unlike a normal upstream Release build. With asserts on, the
# device assert inside block_reduce() (used by reduce_rows_f32, the GGML_OP_SUM_ROWS
# kernel for MoE-router top-k weight normalization) makes that kernel's code object
# require *hostcall* services. Hostcall needs PCIe atomics, which are not enabled on
# this gfx1100 host, so the runtime rejects the dispatch:
#     Pcie atomics not enabled, hostcall not supported
#     AQL dispatch failed!  ->  hipLaunchKernel: hipErrorIllegalState
# Defining NDEBUG removes the device asserts (and the host-side debug assert in
# ggml_cuda_graph_evaluate_and_capture), so the kernel dispatches normally.
# See README.md for the full diagnosis.
CFLAGS="${CFLAGS} -DNDEBUG"
CXXFLAGS="${CXXFLAGS} -DNDEBUG"
